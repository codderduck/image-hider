<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Orange square background -->
  <rect width="128" height="128" fill="#F97316"/>

  <!-- Bill (behind the head so the head outline stays continuous) -->
  <path d="M84 50 C100 48 114 51 120 58 C122 64 118 70 110 72 C100 74 90 72 84 68 Z"
        fill="#FFB020" stroke="#1B120B" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="103" cy="58" r="1.8" fill="#1B120B" opacity="0.85"/>

  <!-- White duck head and neck (neck runs off the bottom edge) -->
  <path d="M31 140 C30 118 33 104 35 94 C29 84 28 66 36 52 C44 38 60 31 74 34 C85 36 91 44 92 54 C92 62 89 69 86 75 C85 82 88 90 92 98 C96 108 96 124 95 140 Z"
        fill="#FFFFFF" stroke="#1B120B" stroke-width="7" stroke-linejoin="round"/>

  <!-- Eye -->
  <circle cx="72" cy="50" r="5.5" fill="#1B120B"/>
  <circle cx="74" cy="48" r="1.7" fill="#FFFFFF"/>

  <!-- Cheek -->
  <circle cx="60" cy="70" r="5" fill="#F97316" opacity="0.45"/>
</svg>
